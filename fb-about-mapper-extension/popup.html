<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FB About Mapper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      font-size: 10px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .status-bar {
      background: rgba(30, 30, 50, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-bar .label { color: #9ca3af; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-bar .value { color: #e0e0e0; margin-top: 2px; word-break: break-all; }
    .status-bar.error .value { color: #f87171; }
    .status-bar.success .value { color: #34d399; }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(30, 30, 50, 0.8);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(99, 102, 241, 0.15); }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.25); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: rgba(30, 30, 50, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-card .num { font-size: 20px; font-weight: 700; color: #a5b4fc; }
    .stat-card .label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

    .section-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .section-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .section-item:hover { background: rgba(99, 102, 241, 0.1); }
    .section-item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .section-item .dot.found { background: #34d399; }
    .section-item .dot.empty { background: #6b7280; }
    .section-item .name { flex: 1; color: #d1d5db; }
    .section-item .count { color: #6b7280; font-size: 10px; }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(30, 30, 50, 0.8);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 4px;
      transition: width 0.3s;
    }

    #log {
      background: rgba(15, 15, 30, 0.9);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      color: #9ca3af;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: none;
    }
    #log.visible { display: block; }
    #log .entry { padding: 1px 0; }
    #log .entry.info { color: #60a5fa; }
    #log .entry.success { color: #34d399; }
    #log .entry.warn { color: #fbbf24; }
    #log .entry.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 FB About Mapper</h1>
    <span class="badge">v1.0</span>
  </div>

  <div id="status" class="status-bar">
    <div class="label">Current Page</div>
    <div class="value" id="pageUrl">Checking...</div>
  </div>

  <div class="stats" id="statsPanel" style="display:none;">
    <div class="stat-card"><div class="num" id="statSections">0</div><div class="label">Sections</div></div>
    <div class="stat-card"><div class="num" id="statFields">0</div><div class="label">Fields</div></div>
    <div class="stat-card"><div class="num" id="statValues">0</div><div class="label">Values</div></div>
  </div>

  <div class="progress-bar" id="progressBar" style="display:none;">
    <div class="fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="section-list" id="sectionList" style="display:none;"></div>

  <div id="log"></div>

  <button class="btn btn-primary" id="btnScan">
    <span>⚡</span> Scan This About Page
  </button>
  <button class="btn btn-primary" id="btnScanAll" style="display:none;">
    <span>🔄</span> Scan ALL About Sections (Auto-Navigate)
  </button>
  <button class="btn btn-secondary" id="btnExport" style="display:none;">
    <span>📋</span> Copy JSON Map to Clipboard
  </button>
  <button class="btn btn-secondary" id="btnDownload" style="display:none;">
    <span>💾</span> Download JSON Map
  </button>
  <button class="btn btn-secondary" id="btnToggleLog">
    <span>📜</span> Toggle Log
  </button>
  <button class="btn btn-danger" id="btnHighlight" style="display:none;">
    <span>🎨</span> Highlight Data Elements on Page
  </button>

  <script src="popup.js"></script>
</body>
</html>
